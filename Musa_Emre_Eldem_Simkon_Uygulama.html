<title>Musa Emre ELDEM · Simkon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2; --card:#FFFFFF; --ink:#14181D; --muted:#55606B; --line:#DCE1E6;
  --head:#11161C; --headInk:#F3F5F7; --accent:#0B7F84; --accentInk:#FFFFFF; --accentHead:#7FB0FF; --chip:#F4F6F8; --trace:#009999;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0E12; --card:#151A20; --ink:#EDF0F3; --muted:#9AA5B0; --line:#262E37;
    --head:#0F1318; --headInk:#F3F5F7; --accent:#22B8BE; --accentInk:#14181D; --chip:#1C232B; --trace:#009999;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0E12; --card:#151A20; --ink:#EDF0F3; --muted:#9AA5B0; --line:#262E37;
  --head:#0F1318; --headInk:#F3F5F7; --accent:#22B8BE; --accentInk:#14181D; --chip:#1C232B; --trace:#009999;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.head{position:relative;background:var(--head);color:var(--headInk);padding:28px 24px 26px;overflow:hidden}
.head svg.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.logo{position:relative;display:inline-block;background:#fff;border-radius:12px;padding:8px 12px;line-height:0}
.logo img{display:block;width:168px;height:auto;max-width:100%}
.logos{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logos .sp{height:60px;width:auto;display:block;flex:0 0 auto}
.logos .slogo-h{flex:0 1 auto;min-width:0}
.logos .slogo-h img{max-width:100%}
.slogo-h{position:relative;line-height:0}
.slogo-h img{width:min(170px,42vw);height:auto;display:block}
.slogo-s{line-height:0}
.slogo-s img{width:230px;height:auto;display:block}
.wordmark{position:relative;display:inline-flex;flex-direction:column;line-height:1;gap:4px}
.wm-a{font-family:Sora,system-ui,sans-serif;font-weight:700;font-size:22px;letter-spacing:.2em;color:#fff}
.wm-b{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accentHead)}
.wordmark.big .wm-a{font-size:34px}.wordmark.big .wm-b{font-size:14px;text-align:center}
.brand{position:relative;display:flex;align-items:center;gap:10px;font-family:Sora,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#C9D0D7}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#14181D}
.name{position:relative;margin:26px 0 6px;font-family:Sora,system-ui,sans-serif;font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.org{position:relative;margin:0;font-size:14.5px;line-height:1.45;color:#B8C1CA;max-width:30ch}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:20px 18px 8px}
.tile{flex:0 0 calc((100% - 24px) / 3);aspect-ratio:1/1;display:grid;place-items:center;border-radius:18px;background:var(--chip);border:1px solid var(--line);color:var(--accent);text-decoration:none;transition:transform .12s ease}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet-in{position:relative;width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:28px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.sv{font-family:Sora,system-ui,sans-serif;font-size:24px;font-weight:600;margin:6px 0 20px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 16px "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;text-decoration:none;cursor:pointer}
.sbtn.primary{background:var(--accent);color:var(--accentInk);border-color:transparent}
.sclose{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:28px;cursor:pointer}
.savebtn{display:block;width:calc(100% - 36px);margin:10px 18px 0;min-height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accentInk);font:600 16px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
.savebtn[hidden],.inst[hidden]{display:none}
.inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;background:#1A222B;color:#EDF0F3;border:1px solid #25303A;border-radius:16px;padding:14px 8px 14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:440px;margin:0 auto}
.inst-t{flex:1;font-size:14px;line-height:1.4}.inst-t b{display:block;margin-bottom:2px}
.inst button{width:44px;height:44px;border:0;background:none;color:#9AA5B0;font-size:26px;cursor:pointer}
@media print{.inst,.savebtn{display:none!important}}
.qr.flash{outline:3px solid var(--accent);outline-offset:2px}
.qr{transition:outline-color .3s}
.tile:active{transform:scale(.95)}
.tile svg{width:38%;height:38%}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 18px 6px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;border-radius:14px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line)}
.qbtn.primary{background:var(--accent);color:var(--accentInk);border-color:transparent}
.qbtn svg{width:22px;height:22px}
.list{padding:8px 18px 4px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row:last-child{border-bottom:0}
.ico{flex:0 0 40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:20px;height:20px}
.txt{min-width:0;flex:1}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.val{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.chev{color:var(--muted);flex:0 0 auto}
.qr{margin:10px 18px 20px;padding:18px;border-radius:16px;background:var(--chip);border:1px solid var(--line);display:flex;gap:16px;align-items:center}
.qrbox{flex:0 0 120px;width:120px;height:120px;background:#fff;border-radius:10px;padding:8px;display:grid;place-items:center}
.qrbox svg{width:100%;height:100%}
.qr h2{margin:0 0 4px;font-family:Sora,system-ui,sans-serif;font-size:15px;font-weight:600}
.qr p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}
.splash{position:fixed;inset:0;z-index:50;background:var(--head);color:var(--headInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;visibility:hidden;animation:splash 3.5s linear forwards}
@keyframes splash{0%,86%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.splash .slogo{background:#fff;border-radius:14px;padding:10px 14px;line-height:0}
.splash .slogo img{width:190px;height:auto;display:block}
.ring{position:relative;width:120px;height:120px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:#0F9BA0;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:0;animation:drain 3s linear forwards}
.num span{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:tick 1s ease forwards}
.num .n2{animation-delay:1s}.num .n1{animation-delay:2s}
@keyframes tick{0%{opacity:0;transform:scale(1.5)}20%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1)}}
.num{position:absolute;inset:0;display:grid;place-items:center;font-family:Sora,system-ui,sans-serif;font-weight:700;font-size:56px}

@keyframes drain{to{stroke-dashoffset:339.3}}
@keyframes pop{0%{transform:scale(1.5);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.splash{display:none}}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{color-scheme:dark;--bg:#11161C!important;--card:#11161C!important;--head:#11161C!important;--ink:#EDF0F3!important;--muted:#9AA5B0!important;--line:#25303A!important;--chip:#1A222B!important;--accent:#22B8BE!important;--accentInk:#11161C!important}
.card{border:0!important}
.head{padding-bottom:18px}
</style>
